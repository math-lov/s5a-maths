<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>組合示範 · Combination demo · 5A 數學溫習站</title>
<meta name="description" content="組合示範：為何要除 r!——同一隊有兩種寫法，20 ÷ 2! = 10。">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="demo" data-lang="both">

<!-- 獨立外殼：與站內（教學卡）共用同一支 assets/demos.js 與同一份 style.css。
     ?step=N 跳到第 N 步（0–3）。 -->

<div class="topbar">
  <div class="inner">
    <a class="btn btn-sm btn-ghost" href="../index.html"><span class="arw" aria-hidden="true">←</span><span class="l-zh">主目錄</span><span class="l-en">Home</span></a>
    <div class="spacer"></div>
    <span id="lang-slot"></span>
  </div>
</div>

<div class="demo-shell">
  <h1><span class="l-zh">組合示範</span><span class="l-en">Combination demo</span></h1>
  <p class="lead">
    <span class="l-zh">5 人選 2 人組隊：有次序 P(5,2) = 20，唔計次序 C(5,2) = 20 ÷ 2! = 10。</span>
    <span class="l-en">Choose 2 of 5: with order P(5,2) = 20; ignoring order C(5,2) = 20 ÷ 2! = 10.</span>
  </p>
  <div class="card">
    <div id="demo-slot"></div>
  </div>
  <p class="small muted">
    <span class="l-zh">點舞台上的學生可以換另一隊；「已找到隊伍」會累加，試齊 10 隊。</span>
    <span class="l-en">Tap students to switch teams; the counter climbs towards all 10 teams.</span>
  </p>
</div>

<script src="../assets/demos.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  try {
    var saved = localStorage.getItem("s5a-lang");
    if (saved) document.body.setAttribute("data-lang", saved);
  } catch (e) { /* 私密模式：用預設值 */ }
  var bar = window.S5A_DEMO.langBar();
  document.getElementById("lang-slot").appendChild(bar);
  if (bar.__paint) bar.__paint();
  var step = parseInt(q.get("step") || "0", 10);
  window.S5A_DEMO.combination(document.getElementById("demo-slot"),
    { step: isNaN(step) ? 0 : step });
})();
</script>
</body>
</html>
